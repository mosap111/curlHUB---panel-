<!DOCTYPE html>
<html>
<body>
<div id="test">Arabic</div>
<script>
window.ar_to_en = {"Arabic": "English", "NewArabic": "NewEnglish"};
const applyTranslations = () => {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, null, false);
    const nodes = [];
    let n;
    while (n = walker.nextNode()) nodes.push(n);
    
    for (let node of nodes) {
        if (node.nodeType === 3) {
            let text = node.nodeValue.trim();
            if (text && window.ar_to_en[text]) {
                node.nodeValue = node.nodeValue.replace(text, window.ar_to_en[text]);
            }
        }
    }
    
    const observer = new MutationObserver((mutations) => {
        mutations.forEach(m => {
            m.addedNodes.forEach(node => {
                if (node.nodeType === 1) {
                    const dynWalker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, null, false);
                    let dynN;
                    while (dynN = dynWalker.nextNode()) {
                        if (dynN.nodeType === 3) {
                            let text = dynN.nodeValue.trim();
                            if (text && window.ar_to_en[text]) {
                                dynN.nodeValue = dynN.nodeValue.replace(text, window.ar_to_en[text]);
                            }
                        }
                    }
                } else if (node.nodeType === 3) {
                    let text = node.nodeValue.trim();
                    if (text && window.ar_to_en[text]) {
                        node.nodeValue = node.nodeValue.replace(text, window.ar_to_en[text]);
                    }
                }
            });
        });
    });
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
};
applyTranslations();
setTimeout(() => {
    document.getElementById('test').innerHTML = '<span>NewArabic</span>';
    console.log("Updated innerHTML. Current text:", document.getElementById('test').innerHTML);
    setTimeout(() => {
        console.log("After observer. Current text:", document.getElementById('test').innerHTML);
    }, 100);
}, 500);
</script>
</body>
</html>
